<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyPhy Selection Explorer</title>
    <link rel="stylesheet" href="./src/styles.css?v=mss-interpretation-audit" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Hantavirus selection dashboard</p>
        <h1>HyPhy Selection Explorer</h1>
        <p class="subtitle">
          An interpretable browser dashboard for the current hantavirus FEL, MEME,
          aBSREL, RELAX, and MSS analyses.
        </p>
      </div>
      <div class="threshold-control">
        <label id="p-threshold-title" for="p-threshold">Site BH FDR q-value threshold</label>
        <div class="segmented metric-toggle" role="group" aria-label="Site evidence metric">
          <button class="segment-button active" type="button" data-site-metric="q" aria-pressed="true">q-value</button>
          <button class="segment-button" type="button" data-site-metric="p" aria-pressed="false">p-value</button>
        </div>
        <input id="p-threshold" type="range" min="0.01" max="0.20" step="0.01" value="0.10" />
        <output id="p-threshold-label">0.10</output>
      </div>
    </header>

    <main id="app">
      <section class="loading">Loading dashboard tables...</section>
    </main>

    <script type="module" src="./src/app.js?v=mss-interpretation-audit"></script>
  </body>
</html>
